<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e1b4b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="136" height="136" rx="32" fill="url(#bg)"/>

  <!-- Decorative circle (subtle) -->
  <circle cx="72" cy="72" r="52" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.25"/>

  <!-- Letter Q stylized -->
  <g filter="url(#shadow)">
    <!-- Outer ring of Q -->
    <circle cx="66" cy="66" r="30" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
    <!-- Tail of Q -->
    <line x1="82" y1="82" x2="100" y2="100" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Checkmark accent (inside Q) -->
  <path d="M 54 66 L 62 75 L 80 54" fill="none" stroke="url(#accent)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small dots accent (quiz bubbles) -->
  <circle cx="28" cy="28" r="3" fill="#818cf8" opacity="0.6"/>
  <circle cx="116" cy="28" r="2.5" fill="#818cf8" opacity="0.4"/>
  <circle cx="28" cy="116" r="2.5" fill="#818cf8" opacity="0.4"/>
</svg>
